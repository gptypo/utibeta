components:
  content_blocks:
    type: block
    label: Tartalomblokkok
    list:
      collapsible:
        collapsed: true
    blockKey: type
    description: Tetszőleges számú új tartalomblokk adható az aloldal meglévő tartalma után. A blokkok sorrendje átrendezhető.
