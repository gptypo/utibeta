    - name: text
      label: Szöveg
      fields:
      - name: hidden
        label: Blokk elrejtése
        type: boolean
        description: Bekapcsolva a blokk megmarad a JSON-ban, de nem jelenik meg az alkalmazásban.
      - name: publicationStatus
        label: Publikálási állapot
        type: select
        default: published
        description: 'Publikált: látható. Piszkozat/Archivált: megmarad a CMS-ben, de az app és a kereső nem mutatja.'
        options:
          values:
          - value: published
            label: Publikált
          - value: draft
            label: Piszkozat
          - value: archived
            label: Archivált
      - name: category
        label: Kategória
        type: string
        description: Opcionális. A kereső/szűrés használja.
      - name: tags
        label: Címkék / tagek
        type: string
        list: true
        description: Opcionális keresési címkék. Új címke külön sorban adható hozzá.
      - name: stylePreset
        label: Megjelenési stílus
        type: select
        default: default
        description: Biztonságos, előre elkészített vizuális preset. A konkrét kinézetet a CSS határozza meg.
        options:
          values: &id001
          - value: default
            label: Alap
          - value: card
            label: Kártyás
          - value: highlight
            label: Kiemelt
