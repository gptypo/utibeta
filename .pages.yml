      - name: customClass
        label: Egyedi CSS osztály
        type: string
        description: 'Opcionális. Példa: szakacs-hero. Csak kisbetű, szám és kötőjel; CSS-kódot ne írj ide.'
        pattern:
          regex: ^([a-z][a-z0-9-]{0,63})?$
          message: Kisbetűvel kezdődő CSS osztálynév kell; csak a-z, 0-9 és kötőjel használható.
