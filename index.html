    .splash__pin{z-index:1}.splash__rocket{z-index:2;animation:splash-launch 4s 1s ease-in-out infinite}

    @keyframes splash-launch{0%{transform:translateY(0);opacity:1;filter:blur(0)}35%{transform:translateY(-90vh);opacity:1;filter:blur(20px)}35.1%{opacity:0;transform:translateY(100vh)}35.2%{opacity:1;filter:blur(10px)}70%,100%{transform:translateY(0);filter:blur(0)}}
    @media (prefers-reduced-motion:reduce){.splash__rocket{animation:none}}
  </style>

  <script>
    (() => {
      const splash = document.querySelector('#splash');
      const startedAt = performance.now();
      const minimumVisibleMs = 1800;
      const fadeMs = 420;
      let appReady = false;
      let entered = false;
      let startApp = null;
      let timer = 0;

      const leave = (skipDelay = false) => {
        if (entered || !appReady) return;
        const wait = skipDelay ? 0 : Math.max(0, minimumVisibleMs - (performance.now() - startedAt));
        clearTimeout(timer);
        timer = window.setTimeout(() => {
          if (entered || !appReady) return;
          entered = true;
          splash?.classList.add('is-leaving');
          window.setTimeout(() => {
            if (splash) splash.hidden = true;
            const app = document.querySelector('#app');
            if (app) app.hidden = false;
            if (typeof startApp === 'function') startApp();
          }, fadeMs);
        }, wait);
      };

      document.querySelector('[data-skip-splash]')?.addEventListener('click', () => leave(true));
      window.UtitervSplash = {
        ready(callback) { appReady = true; startApp = callback; leave(false); },
        showAppNow(callback) { appReady = true; startApp = callback; leave(true); }
      };
    })();
  </script>

  <script>
    (() => {
      const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
      const showStartupError = async error => {
        const splash = document.querySelector('#splash');
          if (splash) splash.hidden = true;
        if (app) app.hidden = false;
        const view = document.querySelector('#view');
        if (!view) return;
        let c={}; try{const r=await fetch('content/ui.json',{cache:'no-store'});c=(await r.json()).startupError||{}}catch{}
        view.innerHTML = `<section class="startup-error"><span class="eyebrow eyebrow--dark">${esc(c.eyebrow)}</span><h1>${esc(c.title)}</h1><p>${esc(c.text)}</p><details><summary>${esc(c.details)}</summary><pre>${esc(String(error?.message || error || c.unknown || ''))}</pre></details></section>`;
      };
      window.addEventListener('error', event => showStartupError(event.error || event.message));
      window.addEventListener('unhandledrejection', event => showStartupError(event.reason));
    })();
  </script>
