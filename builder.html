<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Studio Builder</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <!-- Ide épül fel a teljes Builder felület -->
  <div id="builder-root"></div>

  <!-- Builder modul betöltése -->
  <script src="js/studio-builder.js"></script>

  <!-- Inicializálás -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      
      // Példa kezdő adatszerkezet (akár localStorage-ból vagy Netlify/szerver JSON-ból is tölthető)
      const initialData = [
        {
          id: 'block_1',
          type: 'text',
          title: 'Bevezetés',
          content: 'Üdvözöllek a mindfulness gyakorlatok között!',
          category: 'mindfulness'
        },
        {
          id: 'block_2',
          type: 'exercise',
          title: 'Dobozlégzés',
          inhale: 4,
          hold1: 4,
          exhale: 4,
          hold2: 4,
          cycles: 4
        }
      ];

      // Builder indítása
      window.initAppBuilder('builder-root', initialData);
    });
  </script>
</body>
</html>
