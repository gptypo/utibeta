<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Útiterv Studio – Tartalom előnézet</title>
<style>
html,body{margin:0;min-height:100%;background:#0f171b;color:#f7fbfa;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.preview-shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.preview-bar{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;background:#111a1e;border-bottom:1px solid #25343a}
.preview-bar strong{font-size:.9rem}.preview-badge{padding:5px 9px;border-radius:999px;background:#14e8c9;color:#07110f;font-size:.72rem;font-weight:900}
iframe{width:100%;height:calc(100vh - 49px);border:0;background:white}
</style>
</head><body>
<div class="preview-shell"><div class="preview-bar"><strong>Élő tartalom-előnézet</strong><span class="preview-badge" id="preview-state">Várakozás</span></div><iframe id="app-frame" src="index.html?preview=1"></iframe></div>
<script>
const frame=document.getElementById('app-frame'),badge=document.getElementById('preview-state');let pending=null;
function send(){if(!pending||!frame.contentWindow)return;frame.contentWindow.postMessage({type:'UTITERV_PREVIEW_CONTENT',content:pending},'*');badge.textContent='Frissítve'}
window.addEventListener('message',e=>{if(e.data?.type==='UTITERV_SET_PREVIEW_CONTENT'){pending=e.data.content;badge.textContent='Betöltés…';send()}});
frame.addEventListener('load',()=>setTimeout(send,250));
</script></body></html>
