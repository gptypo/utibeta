<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Útiterv – Live Server reset</title><style>body{font-family:system-ui,sans-serif;max-width:680px;margin:60px auto;padding:24px;line-height:1.5}button{font:inherit;padding:12px 18px;border-radius:999px;border:0;background:#111;color:#fff}</style></head><body><h1>Live Server gyorsítótár törlése</h1><p>Ez az oldal eltávolítja az Útiterv korábbi service workerét és cache-ét ezen a localhost címen.</p><button id="reset">Törlés és alkalmazás megnyitása</button><script>document.querySelector('#reset').onclick=async()=>{if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}if('caches'in window){for(const n of await caches.keys())await caches.delete(n)}localStorage.removeItem('utiterv-beta-100');location.replace('./index.html?clean='+Date.now())}</script></body></html>
