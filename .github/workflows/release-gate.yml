name: Release gate

on:
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Repository checkout
        uses: actions/checkout@v7
      - name: Node.js setup
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Run full release validation
        run: npm run validate:release
