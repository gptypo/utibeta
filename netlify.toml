[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/_assets/utiterv-base.zip"]

# Az AI-kulcsot NE írd ebbe a fájlba.
# Netlify UI → Project configuration → Environment variables:
# GEMINI_API_KEY = ...
# Opcionális:
# GEMINI_MODEL = gemini-3.6-flash
# NETLIFY_AUTH_TOKEN = ...   # csak automatikus production deployhoz
# NETLIFY_SITE_ID = ...      # csak automatikus production deployhoz


# BETA 3.5 JSON Content Workflow secrets (Netlify UI-ban állítsd be):
# GEMINI_API_KEY = ...
# GITHUB_TOKEN = ...        # fine-grained token, Contents: Read and write
# GITHUB_OWNER = ...
# GITHUB_REPO = ...
# GITHUB_BRANCH = main      # opcionális
# GEMINI_CONTENT_MODEL = gemini-3.5-flash-lite  # opcionális
